name: Pilgrimage Hajj-Umrah module QA
on:
  pull_request:
    paths:
      - 'src/pages/Pilgrimage.tsx'
      - 'src/components/pilgrimage/**'
      - 'src/lib/pilgrimage/**'
      - 'scripts/*pilgrimage*'
      - '.github/workflows/pilgrimage-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/Pilgrimage.tsx'
      - 'src/components/pilgrimage/**'
      - 'src/lib/pilgrimage/**'
      - 'scripts/*pilgrimage*'
      - '.github/workflows/pilgrimage-qa.yml'
jobs:
  pilgrimage-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bun
        run: npm install --global bun@1.4.4 --no-audit --no-fund
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test pilgrim pricing, cancellation, capacity and operational readiness
        run: bun src/lib/pilgrimage/operations.test.ts
      - name: Check TypeScript
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
