name: Pilgrimage Hajj-Umrah module QA
on:
  pull_request:
    paths:
      - 'src/pages/Pilgrimage.tsx'
      - 'src/components/pilgrimage/**'
      - 'src/lib/pilgrimage/**'
      - 'scripts/*pilgrimage*'
      - '.github/workflows/pilgrimage-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/Pilgrimage.tsx'
      - 'src/components/pilgrimage/**'
      - 'src/lib/pilgrimage/**'
      - 'scripts/*pilgrimage*'
      - '.github/workflows/pilgrimage-qa.yml'
jobs:
  pilgrimage-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bun
        run: npm install --global bun@1.4.4 --no-audit --no-fund
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test pilgrim pricing, cancellation, capacity and operational readiness
        run: bun src/lib/pilgrimage/operations.test.ts
      - name: Test Group / FIT / B2B quote validators and margin calculation
        run: bun src/lib/pilgrimage/sales.test.ts
      - name: Check TypeScript
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build

  pilgrimage-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated PostgreSQL guardrail fixtures only
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-pilgrimage-guardrails.sql

  pilgrimage-sales-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Test tenant isolation, Group/FIT/B2B models and internal cost privacy
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-pilgrimage-sales-models.sql

  pilgrimage-allocation-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Test atomic internal holds, shared capacity, release and RLS in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-pilgrimage-seat-allocations.sql
