name: Customer quote print checks
on:
  pull_request:
    paths:
      - 'src/pages/QuoteDetails.tsx'
      - '.github/workflows/quote-print.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/QuoteDetails.tsx'
      - '.github/workflows/quote-print.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bun via npm registry (GitHub release CDN fallback)
        run: |
          npm install --global bun@1.4.4 --no-audit --no-fund
          bun --version
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build
