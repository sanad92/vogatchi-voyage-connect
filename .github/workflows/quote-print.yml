name: Customer quote print checks
on:
  pull_request:
    paths:
      - 'src/pages/QuoteDetails.tsx'
      - '.github/workflows/quote-print.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/QuoteDetails.tsx'
      - '.github/workflows/quote-print.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build
