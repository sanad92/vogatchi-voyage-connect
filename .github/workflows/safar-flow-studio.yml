name: Safar Flow Studio checks
on:
  pull_request:
    paths:
      - 'src/lib/safarFlow/**'
      - 'src/pages/SafarFlowStudio.tsx'
      - 'src/lib/sop.ts'
      - 'src/hooks/useSafarFlowFollowups.ts'
      - 'src/hooks/useSafarFlowJobHealth.ts'
      - 'src/hooks/useSafarFlowAlerts.ts'
      - 'src/components/safar-flow/**'
      - 'scripts/*safar-flow*'
      - 'scripts/test-safar-flow-followup-dispatch.sql'
      - 'scripts/deploy-safar-flow-job-queue.sql'
      - 'scripts/test-safar-flow-job-queue.sql'
      - 'src/App.tsx'
      - 'src/config/moduleNavigation.ts'
      - '.github/workflows/safar-flow-studio.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/safarFlow/**'
      - 'src/pages/SafarFlowStudio.tsx'
      - 'src/lib/sop.ts'
      - 'src/hooks/useSafarFlowFollowups.ts'
      - 'src/hooks/useSafarFlowJobHealth.ts'
      - 'src/hooks/useSafarFlowAlerts.ts'
      - 'src/components/safar-flow/**'
      - 'scripts/*safar-flow*'
      - 'scripts/test-safar-flow-followup-dispatch.sql'
      - 'scripts/deploy-safar-flow-job-queue.sql'
      - 'scripts/test-safar-flow-job-queue.sql'
      - 'src/App.tsx'
      - 'src/config/moduleNavigation.ts'
      - '.github/workflows/safar-flow-studio.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/verify-ops-task-contract.mjs
      - run: bun src/lib/safarFlow/engine.test.ts
      - run: node scripts/verify-safar-flow-runtime.mjs
      - run: bunx tsc --noEmit
      - run: bun run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client if absent
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Test followup trigger, row claiming and notifications in isolated Postgres
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-safar-flow-followup-dispatch.sql
      - name: Test durable booking task queue in separate ephemeral database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE safar_flow_test;'
          psql -h localhost -p 5432 -U postgres -d safar_flow_test -v ON_ERROR_STOP=1 -f scripts/test-safar-flow-job-queue.sql
          psql -h localhost -p 5432 -U postgres -d safar_flow_test -v ON_ERROR_STOP=1 -f scripts/test-safar-flow-monitor.sql
          psql -h localhost -p 5432 -U postgres -d safar_flow_test -v ON_ERROR_STOP=1 -f scripts/test-safar-flow-failure-alerts.sql
          psql -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE safar_approval_test;'
          psql -h localhost -p 5432 -U postgres -d safar_approval_test -v ON_ERROR_STOP=1 -f scripts/test-safar-flow-sop-approvals.sql
