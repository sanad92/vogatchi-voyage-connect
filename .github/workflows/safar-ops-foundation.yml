name: Safar ERP operations foundation checks
on:
  pull_request:
    paths:
      - 'src/hooks/useOpsCommandCenter.ts'
      - 'src/hooks/useBookingWorkspace.tsx'
      - 'src/hooks/useBookingServices.ts'
      - 'src/pages/OperationsQueue.tsx'
      - 'src/pages/OperationsCommandCenter.tsx'
      - 'src/components/bookings/workspace/ItineraryTab.tsx'
      - 'scripts/verify-ops-task-contract.mjs'
      - '.github/workflows/safar-ops-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'src/hooks/useOpsCommandCenter.ts'
      - 'src/hooks/useBookingWorkspace.tsx'
      - 'src/hooks/useBookingServices.ts'
      - 'src/pages/OperationsQueue.tsx'
      - 'src/pages/OperationsCommandCenter.tsx'
      - 'src/components/bookings/workspace/ItineraryTab.tsx'
      - 'scripts/verify-ops-task-contract.mjs'
      - '.github/workflows/safar-ops-foundation.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/verify-ops-task-contract.mjs
      - run: bunx tsc --noEmit
      - run: bun run build
